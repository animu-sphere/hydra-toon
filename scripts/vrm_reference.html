<html lang="en"><meta charset="utf-8"><title>Local VRM reproduction comparison</title>
<style>body{font:16px system-ui;background:#222;color:#eee;margin:24px} img,canvas{width:400px;height:450px} #views{display:flex;gap:20px}pre{white-space:pre-wrap}</style>
<h1>VRM reference comparison</h1>
<p>three-vrm 3.5.5 / Three.js r180. Exact exported viewport camera, white key plus 0.25 ambient after Lambert normalization, sRGB output, no tone mapping. Files stay on this computer.</p>
<button id="run">Capture reference set</button> <select id="cases" aria-label="Comparison case"></select>
<p id="status" role="status">Ready</p>
<div id="views"><section><h2>Viewport</h2><img id="native" alt="Viewport capture"></section><section><h2>three-vrm</h2><div id="reference"></div></section></div>
<pre id="details"></pre>
<script type="importmap">{"imports":{"three":"/modules/three/build/three.module.js","three/addons/":"/modules/three/examples/jsm/","@pixiv/three-vrm":"/modules/@pixiv/three-vrm/lib/three-vrm.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';
const config = await (await fetch('/config')).json();
const select = document.querySelector('#cases'), status = document.querySelector('#status');
const renderer = new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(800,900,false); renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.NoToneMapping;
renderer.setClearColor(new THREE.Color(0.05,0.10,0.15));
document.querySelector('#reference').append(renderer.domElement);
let errors = [];
renderer.debug.onShaderError = () => errors.push('shader compile/link failure');
const loader = new GLTFLoader(); loader.register(parser => new VRMLoaderPlugin(parser));
const loaded = new Map();
for (const [index, item] of config.cases.entries()) select.add(new Option(item.label,index));
async function render(index, save=false) {
 const item=config.cases[index]; status.textContent=`Rendering ${item.label}`;
 document.querySelector('#native').src=`/${item.name}-viewport.png`;
 if(!loaded.has(item.asset)) {
  const gltf=await loader.loadAsync(`/asset/${item.asset}`);
  // The USD importer converts VRM 0.x's -Z facing convention to +Z.
  VRMUtils.rotateVRM0(gltf.userData.vrm);
  loaded.set(item.asset,gltf);
 }
 const gltf=loaded.get(item.asset), vrm=gltf.userData.vrm;
 if (!vrm) throw new Error('VRM loader did not select a VRM');
 const scene=new THREE.Scene(); scene.add(vrm.scene);
 const camera=new THREE.PerspectiveCamera();
 camera.matrixWorld.fromArray(item.camera.view).invert();
 camera.matrixWorld.decompose(camera.position,camera.quaternion,camera.scale);
 camera.projectionMatrix.fromArray(item.camera.projection);
 camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
 // Match hdToon's camera-relative incident direction, in world space.
 // r180's MToon diffuse uses BRDF_Lambert (1/pi). ToonLight colours
 // already express the resulting diffuse multiplier. Match that convention.
 const key=new THREE.DirectionalLight(0xffffff,Math.PI);
 key.position.copy(new THREE.Vector3(0.25,0.5,1).transformDirection(camera.matrixWorld));
 scene.add(key,key.target,new THREE.AmbientLight(0xffffff,0.25*Math.PI));
 // Do not update spring bones, constraints or humanoid normalization: raw authored rest pose.
 scene.updateMatrixWorld(true); renderer.render(scene,camera);
 const gl=renderer.getContext(), info=gl.getExtension('WEBGL_debug_renderer_info');
 const metadata={three:THREE.REVISION,three_vrm:config.three_vrm,
  samples:gl.getParameter(gl.SAMPLES),renderer:info?gl.getParameter(info.UNMASKED_RENDERER_WEBGL):gl.getParameter(gl.RENDERER),
  materials:vrm.materials.map(m=>({name:m.name,outline:!!m.isOutline,transparent:m.transparent,depthWrite:m.depthWrite,alphaTest:m.alphaTest})),
  calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,errors};
 document.querySelector('#details').textContent=JSON.stringify(metadata,null,2);
 if(errors.length) throw new Error(errors.join('; '));
 if(save){
  const image=renderer.domElement.toDataURL('image/png').split(',')[1];
  const response=await fetch(`/capture/${item.name}`,{method:'POST',body:JSON.stringify({...metadata,image})});
  if(!response.ok)throw new Error('capture save failed');
 }
 status.textContent=`Rendered ${item.label}`;
}
select.onchange=()=>render(Number(select.value)).catch(e=>status.textContent=`Failed: ${e.message}`);
document.querySelector('#run').onclick=async()=>{
 const button=document.querySelector('#run');button.disabled=true;
 try{for(let i=0;i<config.cases.length;i++){select.value=i;await render(i,true);}status.textContent=`Saved ${config.cases.length} reference captures locally`;}
 catch(e){status.textContent=`Failed: ${e.message}`;}finally{button.disabled=false;}
};
await render(0).catch(e=>status.textContent=`Failed: ${e.message}`);
</script></html>
