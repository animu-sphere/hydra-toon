[project]
name = "toon"
version = "0.1.0"

[requires]
platform = "cy2026"
profile = "core"

# The Hydra adapter needs a real OpenUSD imaging runtime (`--profile lookdev`
# or `usd`); the default `core` build stays OpenUSD-free.
[build.intents.hydra]
cache = { TOON_ENABLE_HYDRA2 = { type = "BOOL", value = true } }

# The viewport with the Hydra adapter in one tree, so `--usd <stage>` hosts
# Hydra in the viewport's own frame loop (design policy §31):
# `ost renderer viewport --intent viewport-usd --profile lookdev -- --usd <stage>`.
[build.intents.viewport-usd]
cache = {
  TOON_ENABLE_HYDRA2 = { type = "BOOL", value = true },
  TOON_ENABLE_VIEWPORT = { type = "BOOL", value = true }
}
