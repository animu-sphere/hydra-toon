[project]
name = "toon"
version = "0.6.0"

[requires]
platform = "cy2026"
profile = "core"

# The Hydra adapter needs a real OpenUSD imaging runtime (`--profile lookdev`
# or `usd`); the default `core` build stays OpenUSD-free.
[build.intents.hydra]
cache = { TOON_ENABLE_HYDRA2 = { type = "BOOL", value = true } }

# The viewport with the Hydra adapter in one tree, so `--usd <stage>` hosts
# Hydra in the viewport's own frame loop (design policy §31). `ost test`
# runs the viewport's Hydra CTest here; to look at a stage, use
# `ost renderer viewport --intent hydra --profile lookdev [--with <plugin>] -- --usd <stage>`,
# which builds the same adapters in a tree of its own (docs/guides/BUILDING.md).
[build.intents.viewport-usd]
cache = { TOON_ENABLE_HYDRA2 = { type = "BOOL", value = true }, TOON_ENABLE_VIEWPORT = { type = "BOOL", value = true } }

# The WebGPU backend on Dawn (docs/design/WEBGPU_POLICY.md), Windows only:
# `ost build --intent webgpu` adds `toon-headless --backend webgpu` and its
# CTests. The Dawn release is a pinned download; nothing else links it.
[build.intents.webgpu]
cache = { TOON_ENABLE_WEBGPU = { type = "BOOL", value = true } }
